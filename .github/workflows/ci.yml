name: macOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build without developer credentials
        run: xcodebuild -project next-token-studio.xcodeproj -scheme next-token-studio -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Regression checks
        run: bash scripts/check.sh
